# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Build Scala Native

on:
  push:
    branches: [ "main" ]
    tags: ["*"]

permissions:
  # Set required permissions for Release action
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    # For SBT setup: https://github.com/sbt/setup-sbt
    - uses: actions/checkout@v7
      with:
        ref: yaml_output
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '25'
        cache: 'sbt'
    - uses: sbt/setup-sbt@v1
    - name: Build
      # Simple and Release Build
      run: sbt nativeLink nativeLinkReleaseFull
    - name: Debug
      run: find target/

    # For artifact upload: https://github.com/actions/upload-artifact
    - name: Upload release artifact
      uses: actions/upload-artifact@v7
      with:
        name: openapi-patcher
        path: target/scala*/openapi-patcher-release-full

    # For release artifact: https://github.com/softprops/action-gh-release
    - name: Release
      uses: softprops/action-gh-release@v3
      if: github.ref_type == 'tag'
      with:
        files: target/scala*/openapi-patcher*
